{% extends 'base.html' %}
{% block title %}{{ t(kind) }} — {{ site_name }}{% endblock %}
{% block content %}
<section class="section narrow legal">
  <h1>{{ t(kind) }}</h1>
  {% for p in t(kind + '_text', site=site_name, email=support_email or '—').split('\n') %}
    <p>{{ p }}</p>
  {% endfor %}
</section>
{% endblock %}
