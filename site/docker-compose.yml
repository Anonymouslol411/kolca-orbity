services:
  web:
    build:
      context: ..
      dockerfile: site/Dockerfile
    env_file: .env
    volumes:
      - sitedata:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "5"}

  worker:
    build:
      context: ..
      dockerfile: site/Dockerfile
    env_file: .env
    command: ["python", "app.py", "worker"]
    volumes:
      - sitedata:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      - web
    logging:
      options: {max-size: "10m", max-file: "5"}

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - web
    logging:
      options: {max-size: "10m", max-file: "5"}

volumes:
  sitedata:
  caddy_data:
  caddy_config:
